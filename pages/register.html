<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Create account — PayLite</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
  <link rel="stylesheet" href="../assets/css/style.css">
</head>
<body>

<div class="auth-page">
  <div class="auth-box">

    <div class="auth-brand">
      <div class="logo-icon">
        <i class="fa-solid fa-wallet"></i>
      </div>
      <div class="wordmark">PayLite</div>
      <div class="tagline">Join thousands of users</div>
    </div>

    <div class="auth-card">
      <h2>Create your account</h2>

      <form id="registerForm" novalidate>

        <div class="field">
          <label for="name" >
            <i class="fa-solid fa-user"></i> Full name
          </label>
          <div class="input-wrap">
            <i class="fa-regular fa-user input-icon"></i>
            <input
              type="text"
              id="name"
              name="name"
              placeholder="enter your name"
              autocomplete="name"
              required
            >
          </div>
        </div>

        <div class="field">
          <label for="email">
            <i class="fa-solid fa-envelope"></i> Email address
          </label>
          <div class="input-wrap">
            <i class="fa-regular fa-envelope input-icon"></i>
            <input
              type="email"
              id="email"
              name="email"
              placeholder="you@example.com"
              autocomplete="email"
              required
            >
          </div>
        </div>

        <div class="field">
          <label for="password">
            <i class="fa-solid fa-lock"></i> Password
          </label>
          <div class="input-wrap">
            <i class="fa-solid fa-lock input-icon"></i>
            <input
              type="password"
              id="password"
              name="password"
              placeholder="Min. 8 characters"
              autocomplete="new-password"
              required
            >
            <!-- strength meter injected by auth.js -->
          </div>
        </div>

        <div class="field">
          <label for="Cpassword">
            <i class="fa-solid fa-lock"></i> Confirm password
          </label>
          <div class="input-wrap">
            <i class="fa-solid fa-lock input-icon"></i>
            <input
              type="password"
              id="Cpassword"
              name="Cpassword"
              placeholder="Repeat your password"
              autocomplete="new-password"
              required
            >
          </div>
        </div>

        <button class="btn" type="submit">
          <i class="fa-solid fa-user-plus"></i> Create account
        </button>

      </form>
    </div>

    <p class="auth-footer">
      Already registered? <a href="login.html">Sign in</a>
    </p>

  </div>
</div>

<script src="../assets/js/auth.js?v=2"></script>
</body>
</html>
